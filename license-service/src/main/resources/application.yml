server:
  port: ${SERVER_PORT:8091}
  servlet:
    context-path: /api/v1/license

spring:
  application:
    name: license-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/audit_meta?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:audit}
    password: ${SPRING_DATASOURCE_PASSWORD:audit2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

license:
  # 授权码签名密钥：必须由环境变量 LICENSE_SECRET 注入（见 deploy/docker/.env）
  # 必须与本地离线授权工具 LicenseTool.exe 顶部「签名密钥」一致；密钥不写入代码仓库
  secret: ${LICENSE_SECRET}
  product: ${LICENSE_PRODUCT:LogAudit 日志审计平台}
  data-dir: ${LICENSE_DATA_DIR:/var/lib/license}

security:
  # 与平台 Go 后端同一把 JWT 密钥，用于校验 access token
  jwt-secret: ${JWT_SECRET:change-me-please-9f2c4e1a}

logging:
  level:
    root: INFO
    com.logaudit.license: INFO
