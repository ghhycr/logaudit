# 日志审计平台 - 容器化部署编排（测试机）
# 服务: nginx(对外入口) / clickhouse(日志存储) / mysql(用户·会话·操作审计) / api(自研 Go 认证 API)
# 前端构建: 在宿主机执行（apt nodejs + npmmirror），产物挂载进 nginx 容器
# 用法:
#   docker compose build api      # 需先完成后端编译（见 deploy-m2.sh）
#   docker compose up -d
# 生产注意: 通过 .env 覆盖 MYSQL_PASSWORD / CLICKHOUSE_PASSWORD / JWT_SECRET / ADMIN_INIT_PASSWORD

services:
  # ---------- Nginx 对外入口（静态 + 反代） ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: audit-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/audit/web/dist:/usr/share/nginx/html:ro
      - ./nginx/audit.conf:/etc/nginx/conf.d/audit.conf:ro
      - ./nginx/security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
      - license
    restart: unless-stopped

  # ---------- ClickHouse 日志流水存储 ----------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: audit-clickhouse
    environment:
      CLICKHOUSE_DB: audit
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-audit2026}
    volumes:
      - /data/clickhouse:/var/lib/clickhouse   # 日志数据盘 sdb → /data/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:8123:8123"   # HTTP 接口，仅本机（等保：不对外暴露数据库）
      - "127.0.0.1:9000:9000"   # Native 接口
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ---------- MySQL 用户/会话/操作审计（M2 认证后端） ----------
  mysql:
    image: mysql:8.0
    container_name: audit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root2026Audit}
      MYSQL_DATABASE: audit_meta
      MYSQL_USER: audit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-audit2026}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"   # 仅本机（等保：不对外暴露数据库）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # ---------- Redis（登录防爆破 / 告警去重 / 统计缓存，可选优化层） ----------
  redis:
    image: redis:7-alpine
    container_name: audit-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-audit2026}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"   # 仅本机（等保：不对外暴露）
    restart: unless-stopped

  # ---------- 自研 Go API（M2 认证服务；nginx 反代 /api/ → api:8080） ----------
  api:
    build: ./api
    image: logaudit/api
    container_name: audit-api
    environment:
      PORT: "8080"
      MYSQL_DSN: "audit:${MYSQL_PASSWORD:-audit2026}@tcp(mysql:3306)/audit_meta?parseTime=true&charset=utf8mb4&loc=Local&multiStatements=true"
      CLICKHOUSE_DSN: "clickhouse://default:${CLICKHOUSE_PASSWORD:-audit2026}@clickhouse:9000/audit?dial_timeout=5s&read_timeout=60s"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-audit2026}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-9f2c4e1a}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 宿主机 Redis 部署时 REDIS_ADDR=host.docker.internal:6379
    volumes:
      - /proc:/hostproc:ro    # 宿主机硬件监控（总览仪表盘：CPU/内存）
      - /:/hostroot:ro        # 宿主机根分区磁盘占用（只读挂载）
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ---------- 授权管理模块（Java / Spring Boot 3 + JDK 17） ----------
  # 提供「系统设置 → 授权管理」能力：服务器硬件指纹、授权码 / 授权文件（.lic）校验、
  # 导入激活与导出留痕；授权码一律由本地离线工具 LicenseTool.exe 签发，本服务不提供在线签发。
  # 授权码协议与 LicenseTool.exe 完全一致（LGA2.<base64url>.<hex(HMAC-SHA256)>，密钥 LICENSE_SECRET）
  license:
    build:
      context: ../../license-service
    image: logaudit/license-svc
    container_name: audit-license
    environment:
      SERVER_PORT: "8091"
      LICENSE_SECRET: ${LICENSE_SECRET:?请在 deploy/docker/.env 中设置 LICENSE_SECRET（与本地授权工具 LicenseTool.exe 的签名密钥一致）}
      LICENSE_PRODUCT: "LogAudit 日志审计平台"
      LICENSE_DATA_DIR: "/var/lib/license"
      JWT_SECRET: ${JWT_SECRET:-change-me-please-9f2c4e1a}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/audit_meta?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: "audit"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-audit2026}
    volumes:
      - /:/hostroot:ro       # 宿主机硬件指纹（machine-id / DMI UUID / 网卡 MAC）
      - license-data:/var/lib/license
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Vector 采集器（M4：syslog 514 实时采集 → ClickHouse） ----------
  vector:
    build: ./vector
    image: logaudit/vector:0.44.0
    container_name: audit-vector
    ports:
      - "514:514/udp"   # syslog UDP（客户端 UDP 上传入口）
      - "514:514/tcp"   # syslog TCP
      - "127.0.0.1:8686:8686"  # Vector 管理 API，仅本机
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-audit2026}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nginx-logs:
  mysql-data:
  vector-data:
  redis-data:
  license-data:
