# 日志审计平台 - Nginx 站点配置（容器版，挂载到 /etc/nginx/conf.d/audit.conf）
# 证书: /etc/nginx/certs/audit.crt|audit.key（由 deploy-container.sh 生成）
# 反代: /api/ → http://api-stub:8080（容器网络；M2 后替换为真实后端服务名）

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS（等保三级：仅 TLS 1.2+）
    ssl_certificate     /etc/nginx/certs/audit.crt;
    ssl_certificate_key /etc/nginx/certs/audit.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 等保三级安全响应头（片段在 server 与各 location 重复 include）
    include /etc/nginx/conf.d/security-headers.inc;

    server_tokens off;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # SPA history 路由回退
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 授权管理模块（Java 授权服务 audit-license:8091）— 须置于 /api/ 之前优先匹配
    location /api/v1/license/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://license:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # API 反向代理（自研 Go 认证 API：audit-api）
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # 访问审计日志（等保三级：安全审计）
    access_log /var/log/nginx/audit_access.log combined;
    error_log  /var/log/nginx/audit_error.log warn;
}
