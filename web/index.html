<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 等保三级 · 入侵防范：内容安全策略（CSP），限制脚本/样式/来源，防 XSS 注入 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8080 http://localhost:8080; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" />
  <!-- 等保三级 · 数据保密性：禁止 MIME 嗅探 -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <!-- 等保三级 · 点击劫持防护 -->
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日志审计平台</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
